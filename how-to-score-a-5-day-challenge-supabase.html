let state = loadState();

function getIdentity(){
  try{return JSON.parse(localStorage.getItem(IDENTITY_KEY)||"null")}catch(e){return null}
}
function getDiagnostic(){
  try{return JSON.parse(localStorage.getItem(DIAGNOSTIC_KEY)||"null")}catch(e){return null}
}
async function saveChallengeDayToSupabase(day,data){
  const identity=getIdentity();
  if(!identity) return;
  const payload={
    diagnostic_id: identity.diagnostic_id,
    client_session_id: identity.client_session_id,
    email: identity.email.toLowerCase(),
    student_name: identity.student_name,
    grade: identity.grade,
    day_number: day,
    payload: data
  };
  try{
    const {error}=await scoreASupabase.from("scorea_free_challenge_days").insert(payload);
    if(error && error.code!=="23505") throw error;
  }catch(err){console.error("Supabase challenge save failed",err)}
}
async function saveLearningProfileToSupabase(data){
  const identity=getIdentity(), diag=getDiagnostic();
  if(!identity || !data) return false;
  const payload={
    diagnostic_id: identity.diagnostic_id,
    client_session_id: identity.client_session_id,
    email: identity.email.toLowerCase(),
    student_name: identity.student_name,
    grade: identity.grade,
    primary_type: diag?.primary_type || null,
    secondary_type: diag?.secondary_type || null,
    main_subject: data.subject,
    improvement_goal: data.goal,
    daily_study_time: data.minutes,
    progress_measure: data.measure
  };
  try{
    const {error}=await scoreASupabase.from("scorea_free_learning_profiles").insert(payload);
    if(error && error.code!=="23505") throw error;
    return true;
  }catch(err){
    console.error("Supabase profile save failed",err);
    return false;
  }
}

async function syncSavedProgressToSupabase(){
  const identity=getIdentity();
  if(!identity) return;
  for(const day of state.completed){
    const data=state.data["day"+day];
    if(data) await saveChallengeDayToSupabase(day,data);
  }
  if(state.data.day5){
    await saveLearningProfileToSupabase(state.data.day5);
  }
}

  const focus={A:"Day 2 的理解与自测",B:"Day 2 的有效复习",C:"Day 3 的时间管理",D:"Day 1 与 Day 4 的失分/错题训练",E:"Day 5 的自主计划"};
  el.style.display="block";
  el.innerHTML=`<strong>${i.student_name||"同学"}，欢迎回来。</strong><br>
    你的主要改善方向：<b>${names[d.primary_type]||d.primary_type}</b>；
    第二方向：<b>${names[d.secondary_type]||d.secondary_type}</b>。<br>
    <span class="muted">这5天请特别留意：${focus[d.primary_type]||"每天的实践任务"}。</span>`;
}

function loadState(){
  try{
    const x = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return {completed:x.completed||[], currentDay:x.currentDay||1, data:x.data||{}};
  }catch(e){ return {completed:[],currentDay:1,data:{}}; }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function refreshHeader(){
  const n = state.completed.length;
  document.getElementById("progressText").textContent = `进度：${n} / 5 天完成`;
  document.getElementById("overallProgress").style.width = `${n/5*100}%`;

  const tabs = document.getElementById("dayTabs");
  tabs.innerHTML = "";
  for(let i=1;i<=5;i++){
    const b = document.createElement("button");
    b.className = "day-tab";
    b.textContent = `Day ${i}`;
    if(i===currentDay) b.classList.add("active");
    if(state.completed.includes(i)) b.classList.add("done");
    const unlocked = i===1 || state.completed.includes(i) || state.completed.includes(i-1);
    if(!unlocked) b.classList.add("locked");
    b.onclick = ()=> {
      if(unlocked){ currentDay=i; renderDay(i); }
    };
    tabs.appendChild(b);
  }
}
function openCurrentDay(){
  currentDay = Math.min(Math.max(state.currentDay||1,1),5);
  renderDay(currentDay);
  document.getElementById("dayPanel").scrollIntoView({behavior:"smooth",block:"start"});
}
function renderDay(day){
  currentDay = day;
  const d = dayData[day-1];
  document.getElementById("dayPanel").innerHTML = `
    <div class="day-head">
      <div class="day-number">${day}</div>
      <div><h2>${d.title}</h2><p class="muted">${d.intro}</p></div>
    </div>
    <div class="lesson">${d.lesson}</div>
    ${d.render()}
  `;
  refreshHeader();
  restoreDayValues(day);
  if(state.completed.includes(day)) showSavedResult(day);
}
function selectChoice(el,key){
  el.parentElement.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  temp[key] = el.dataset.value !== undefined ? el.dataset.value : el.textContent.trim();
}
function markComplete(day,data){
  const already=state.completed.includes(day);
  state.data["day"+day] = data;
  if(!already) state.completed.push(day);
  state.completed.sort((a,b)=>a-b);
  if(day<5) state.currentDay = Math.max(state.currentDay,day+1);
  else state.currentDay = 5;
  saveState();
  refreshHeader();
  if(!already) saveChallengeDayToSupabase(day,data);
}
function warn(id,on=true){ document.getElementById(id).classList.toggle("show",on); }
function result(id,html){ const el=document.getElementById(id); el.innerHTML=html; el.classList.add("show"); }

function completeDay1(){
  const reason=temp.d1Reason||state.data.day1?.reason||"";
  const example=document.getElementById("d1Example").value.trim();
  if(!reason||!example){warn("d1warn",true);return}
  warn("d1warn",false);
  markComplete(1,{reason,example});
  const map={
    "粗心":"接下来练习时，重点不是做更快，而是建立“审题 + 最后检查”的习惯。",
    "不会":"先回到知识点，不要马上继续刷同类型难题。",
    "步骤错误":"把正确步骤写成固定顺序，每次照顺序完成。",
    "概念错误":"先弄清楚“为什么”，再做变式题确认真的理解。",
    "时间不够":"开始做限时练习，并训练先易后难和时间分配。"
  };
  result("d1result",`✅ 你今天找出的主要失分原因是：<b>${reason}</b>。<br>${map[reason]}<br><br><b>今天的胜利：</b>你已经从“我又错了”进步到“我知道自己为什么会错”。`);
}
function completeDay2(){
  const method=(temp.d2Method!==undefined?Number(temp.d2Method):state.data.day2?.method);
  const q=document.getElementById("d2Question").value.trim();
  if(method===undefined||!q){warn("d2warn",true);return}
  warn("d2warn",false);
  markComplete(2,{method,q});
  const correct = method===2;
  result("d2result",`${correct?"✅ 选对了。":"💡 更有效的答案是：把书合起来，自己回答问题或做题。"}<br><br>你写下的自测问题是：<b>${escapeHtml(q)}</b><br>今天至少尝试一次“不看答案先作答”，这才是在检查自己会不会。`);
}
function completeDay3(){
  const time=document.getElementById("d3Time").value;
  const subject=document.getElementById("d3Subject").value.trim();
  const task=document.getElementById("d3Task").value.trim();
  const distraction=document.getElementById("d3Distraction").value;
  if(!time||!subject||!task||!distraction){warn("d3warn",true);return}
  warn("d3warn",false);
  markComplete(3,{time,subject,task,distraction});
  result("d3result",`✅ 你的学习区块已经建立：<br><br><b>${time} 开始｜${escapeHtml(subject)}｜25分钟</b><br>任务：${escapeHtml(task)}<br>开始前先处理：${escapeHtml(distraction)}<br><br>今天不要追求做很多，只追求：<b>准时开始 + 完成一个具体任务。</b>`);
}
function completeDay4(){
  const q=document.getElementById("d4Question").value.trim();
  const reason=document.getElementById("d4Reason").value;
  const fix=document.getElementById("d4Fix").value.trim();
  if(!q||!reason||!fix){warn("d4warn",true);return}
  warn("d4warn",false);
  markComplete(4,{q,reason,fix});
  result("d4result",`✅ 你的错题记录已经变成“可以帮助下次进步”的记录：<br><br><b>题目：</b>${escapeHtml(q)}<br><b>原因：</b>${reason}<br><b>正确方法：</b>${escapeHtml(fix)}<br><br>建议：<b>明天或后天把这题遮住答案重新做一次。</b>如果还能做对，才算真正修复。`);
}
function completeDay5(){
  const subject=document.getElementById("d5Subject").value.trim();
  const goal=document.getElementById("d5Goal").value;
  const minutes=document.getElementById("d5Minutes").value;
  const measure=document.getElementById("d5Measure").value.trim();
  if(!subject||!goal||!minutes||!measure){warn("d5warn",true);return}
  warn("d5warn",false);
  const profileData={subject,goal,minutes,measure};
  markComplete(5,profileData);
  saveLearningProfileToSupabase(profileData);
  result("d5result",`✅ 你的30天方向已经完成。系统正在同步到 HOW TO SCORE A 学习档案。`);
  showFinish();
}
function restoreDayValues(day){
  const d=state.data["day"+day]; if(!d)return;
  setTimeout(()=>{
    if(day===1){
      document.getElementById("d1Example").value=d.example||"";
      [...document.querySelectorAll("#d1choices .choice")].forEach(x=>{if(x.textContent.trim()===d.reason)x.classList.add("selected")});
      temp.d1Reason=d.reason;
    }
    if(day===2){
      document.getElementById("d2Question").value=d.q||"";
      [...document.querySelectorAll("#d2choices .choice")].forEach((x,i)=>{if(i===Number(d.method))x.classList.add("selected")});
      temp.d2Method=d.method;
    }
    if(day===3){
      document.getElementById("d3Time").value=d.time||"";
      document.getElementById("d3Subject").value=d.subject||"";
      document.getElementById("d3Task").value=d.task||"";
      document.getElementById("d3Distraction").value=d.distraction||"";
    }
    if(day===4){
      document.getElementById("d4Question").value=d.q||"";
      document.getElementById("d4Reason").value=d.reason||"";
      document.getElementById("d4Fix").value=d.fix||"";
    }
    if(day===5){
      document.getElementById("d5Subject").value=d.subject||"";
      document.getElementById("d5Goal").value=d.goal||"";
      document.getElementById("d5Minutes").value=d.minutes||"";
      document.getElementById("d5Measure").value=d.measure||"";
      if(state.completed.includes(5)) showFinish();
    }
  },0);
}
function showSavedResult(day){
  const d=state.data["day"+day]; if(!d)return;
  setTimeout(()=>{
    const id="d"+day+"result";
    if(!document.getElementById(id)) return;
    if(day===1) result(id,`✅ 已完成。你的主要失分原因：<b>${d.reason}</b>。`);
    if(day===2) result(id,`✅ 已完成。你的自测问题：<b>${escapeHtml(d.q)}</b>`);
    if(day===3) result(id,`✅ 已完成。你的学习区块：<b>${d.time}｜${escapeHtml(d.subject)}｜25分钟</b>`);
    if(day===4) result(id,`✅ 已完成。你的错题原因：<b>${d.reason}</b>`);
    if(day===5) { result(id,"✅ 5天挑战已完成。"); showFinish(); }
  },10);
}
function showFinish(){
  const el=document.getElementById("finishCard"); if(!el)return;
  el.classList.add("show");
  const d=state.data.day5||{};
  document.getElementById("finalSummary").innerHTML = `
    <h3>你的30天学习计划</h3>
    <ul>
      <li><b>重点科目：</b>${escapeHtml(d.subject||"")}</li>
      <li><b>最想改善：</b>${escapeHtml(d.goal||"")}</li>
      <li><b>每天稳定学习：</b>${escapeHtml(d.minutes||"")}</li>
      <li><b>进步判断标准：</b>${escapeHtml(d.measure||"")}</li>
    </ul>
    <p><b>建议每周做一次复盘：</b>这一周哪里进步了？哪里还会重复出错？下周只先解决一个最重要的问题。</p>`;
}
function planText(){
  const d=state.data.day5||{};
  return `HOW TO SCORE A｜我的30天学习计划

重点科目：${d.subject||""}
最想改善：${d.goal||""}
每天稳定学习：${d.minutes||""}
进步判断标准：${d.measure||""}

我会继续使用：
1. 找出失分原因
2. 主动回忆与自测
3. 25分钟具体学习任务
4. 错题原因分析
5. 每周复盘一次`;
}
async function copyPlan(){
  try{await navigator.clipboard.writeText(planText());alert("30天学习计划已复制。")}
  catch(e){alert("无法自动复制，请手动复制页面内容。")}
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

refreshHeader();
renderDiagnosticBanner();
renderDay(currentDay);
syncSavedProgressToSupabase();
</script>
</body>
</html>
