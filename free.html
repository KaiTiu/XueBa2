const STUDENT_TYPES={
zh:{
A:["A型｜基础理解薄弱型","基础理解","先加强真正理解知识的能力。不是做更多题，而是确认自己是否真的明白概念。","老师讲过但换题就不会、记得答案却不懂为什么、学过几天后很快忘记。","今天学完一个知识点后，把书合起来，用自己的话解释：它是什么？为什么？可以举一个例子吗？"],
B:["B型｜学习方法需要升级型","学习方法","你可能花了不少时间，但方法未必有效。重点是主动回忆、测试和错题分析。","一直看书却记不牢、读很久不知道学会什么、做错题只看答案。","今天做 3–5 题小测试，不看答案先作答，再找出一个真正不会的问题。"],
C:["C型｜时间管理失衡型","时间管理","最大的阻力可能不是能力，而是开始太迟、任务不清楚和容易被打断。","临近考试才读、一直拖延、手机游戏打断、计划很多但完成很少。","把“今晚读书”改成：7:30–7:55 数学，完成 5 题并检查一次。"],
D:["D型｜考试失分型","考试策略","平时不一定不会，但考试时容易把会做的分数丢掉。","粗心、看错题、漏步骤、时间不够、会做却丢分、考试紧张。","从下一次练习开始，每个错题标记：粗心 / 不会 / 步骤 / 概念 / 时间。"],
E:["E型｜自主学习不足型","自主学习","比较依赖别人提醒、安排或直接给答案，需要建立自己的学习判断。","不提醒就不开始、不会题马上问人或AI、不知道自己弱点在哪里。","学习前先写：我要完成什么？为什么先做这个？完成后怎样知道自己真的会了？"]},
ms:{
A:["Jenis A｜Kefahaman Asas Lemah","Kefahaman Asas","Utamakan kefahaman sebenar, bukan sekadar membuat lebih banyak soalan. Pastikan anda memahami konsep, bukan hanya mengingati jawapan.","Soalan berubah sedikit lalu tidak tahu menjawab, ingat jawapan tetapi tidak faham sebab, cepat lupa selepas beberapa hari.","Selepas belajar satu konsep hari ini, tutup buku dan terangkan dengan kata-kata sendiri: Apa konsep ini? Mengapa? Boleh beri satu contoh?"],
B:["Jenis B｜Kaedah Belajar Perlu Dipertingkatkan","Kaedah Belajar","Anda mungkin sudah meluangkan banyak masa tetapi kaedahnya belum cukup berkesan. Fokus pada active recall, ujian kendiri dan analisis kesilapan.","Banyak membaca tetapi sukar ingat, belajar lama tetapi tidak tahu apa yang dikuasai, hanya melihat jawapan selepas silap.","Hari ini buat 3–5 soalan ujian kecil tanpa melihat jawapan dahulu, kemudian kenal pasti satu perkara yang benar-benar belum dikuasai."],
C:["Jenis C｜Pengurusan Masa Tidak Stabil","Pengurusan Masa","Halangan terbesar mungkin bukan kemampuan tetapi mula terlalu lewat, tugas tidak jelas dan mudah terganggu.","Ulang kaji saat akhir, suka menangguh, telefon/permainan mengganggu, banyak rancangan tetapi sedikit yang siap.","Tukar “malam ini saya akan belajar” kepada: 7:30–7:55 Matematik, siapkan 5 soalan dan semak sekali."],
D:["Jenis D｜Kehilangan Markah Peperiksaan","Strategi Peperiksaan","Anda mungkin tahu kandungan tetapi masih kehilangan markah dalam peperiksaan. Fokus pada membaca soalan, langkah, masa dan semakan.","Cuai, salah baca soalan, tertinggal langkah, masa tidak cukup, gementar ketika peperiksaan.","Mulai latihan seterusnya, label setiap kesilapan: cuai / tidak tahu / langkah / konsep / masa."],
E:["Jenis E｜Pembelajaran Kendiri Belum Kuat","Pembelajaran Kendiri","Anda mungkin masih bergantung pada peringatan, susunan atau jawapan daripada orang lain. Fokus membina pertimbangan belajar sendiri.","Tidak mula tanpa diingatkan, terus bertanya orang/AI apabila tersekat, tidak jelas kelemahan sendiri.","Sebelum belajar, tulis: Apa yang saya mahu siapkan? Mengapa ini dahulu? Bagaimana saya tahu saya benar-benar sudah boleh?"]},
en:{
A:["Type A｜Weak Foundation Understanding","Foundation Understanding","Strengthen real understanding first. The goal is not simply to do more questions, but to make sure the concepts truly make sense.","You may know a taught example but struggle when the question changes, remember answers without understanding why, or forget quickly after a few days.","After learning one concept today, close the book and explain: What is it? Why does it work? Can I give one example?"],
B:["Type B｜Learning Method Needs an Upgrade","Learning Method","You may already spend plenty of time studying, but the method may not be effective enough. Focus on active recall, self-testing and mistake analysis.","You may reread a lot without remembering, study for a long time without knowing what was learned, or only look at answers after mistakes.","Do a small 3–5-question test today without checking answers first, then identify one thing you genuinely do not know yet."],
C:["Type C｜Unstable Time Management","Time Management","The biggest barrier may not be ability, but starting too late, unclear tasks and frequent distractions.","You may revise only near exams, procrastinate, get interrupted by phone/games, or plan a lot but complete little.","Replace “study tonight” with: 7:30–7:55 Mathematics, complete 5 questions and check once."],
D:["Type D｜Exam Mark-Loss Pattern","Exam Strategy","You may know the material but still lose marks in exams. Focus on question-reading, steps, time allocation and checking.","Carelessness, misreading, missed steps, running out of time, losing marks on known work, exam nerves.","From your next practice, label every mistake: careless / do not know / steps / concept / time."],
E:["Type E｜Independent Learning Needs Strengthening","Independent Learning","You may still depend heavily on reminders, planning or direct answers from others. Build your own learning judgement.","You may not start without reminders, ask people/AI immediately, or be unclear about your own weak areas.","Before studying, write: What will I complete? Why am I doing this first? How will I know I can truly do it?"]}

,"补回步骤 / 表达分","降低考试紧张影响"],"minutesLabel":"每天可以稳定练多久？","measureLabel":"30天后，你会怎样判断“失分真的减少了”？"}],"E":[{"title":"问题 1｜找出你最依赖别人提醒的地方","intro":"自主学习不是“什么都自己来”，而是先能判断自己下一步该做什么。","lesson":"如果每次都等家长、老师或AI告诉你下一步，大脑很难建立自己的学习判断。","choiceLabel":"哪一种最像你现在的情况？","choices":["没人提醒就很难开始","不会题时马上问别人","遇到困难就直接让AI给答案","不清楚自己目前最弱在哪里","计划通常都是别人帮我安排"],"textLabel":"写下最近一次“如果没人提醒，我可能不会主动做”的学习情况：","resultLabel":"你已经找到一个可以开始练自主性的地方"},{"title":"问题 2｜先自己想，再求助","intro":"会求助很重要，但更重要的是在求助前先留下自己的思考。","lesson":"建议顺序：自己尝试 → 写出卡点 → 请求提示 → 再自己完成 → 最后解释。这样AI和老师是在帮助你思考，不是替你思考。","choiceLabel":"遇到不会的题，哪一种做法最能培养自主学习？","choices":["马上问AI要完整答案","先跳过，以后再说","先尝试并写出卡点，再请求提示，最后自己完成","直接看别人怎样做再抄一次"],"correct":2,"textLabel":"写一句你下次卡住时，会先问自己的问题：","good":"✅ 对，先留下自己的思考，再求助，才会真正变强。","retry":"💡 自主学习不是拒绝帮助，而是先自己尝试，再请求适当提示。"},{"title":"问题 3｜自己启动一次学习","intro":"今天不等别人提醒，由你自己决定开始时间和第一项任务。","lesson":"自主学习要练“自己决定 → 自己开始 → 自己检查”。先从一个25分钟的小任务开始。","timeLabel":"你自己决定：今天几点开始？","subjectLabel":"你自己选择先学哪一科？","taskLabel":"25分钟内，你决定完成什么？","distractionLabel":"为了对自己负责，你会先关掉哪一个干扰？","distractions":["手机通知","游戏","YouTube / 短视频","聊天","其他干扰"]},{"title":"问题 4｜建立自己的求助与AI规则","intro":"真正独立的人不是永远不问，而是知道什么时候该自己想、什么时候该求助。","lesson":"好的求助要带着问题来：我试过什么？卡在哪里？我需要提示、解释还是检查？","qLabel":"写一个你最近很想直接问别人或AI的问题：","reasonLabel":"你当时为什么想马上求助？","reasons":["不知道从哪里开始","怕做错","想快点完成","概念真的不懂","习惯性先问别人 / AI"],"fixLabel":"写下你的新规则：你会先尝试什么，什么情况下才求助？"},{"title":"问题 5｜建立30天自主学习计划","intro":"目标不是完全不靠别人，而是越来越能自己发现问题、决定行动和检查结果。","lesson":"用一个重点科目、一个自主习惯和一个衡量方法，连续练30天。","subjectLabel":"未来30天最想练自主学习的科目","goalLabel":"你最想先建立哪一种自主能力？","goals":["不用提醒也能开始","遇到问题先自己尝试","学会自己安排优先级","减少对AI直接答案的依赖","学会自己检查学习结果"],"minutesLabel":"每天愿意为自主训练留多少时间？","measureLabel":"30天后，你会用什么证据证明自己更独立了？"}]},"ms":{"A":[{"title":"Soalan 1｜Kenal Pasti Titik Kefahaman yang Sebenar-benar Tersekat","intro":"Jangan terus tambah latihan. Cari dahulu bahagian yang anda sebenarnya belum faham.","lesson":"Masalah kefahaman asas biasanya bukan kerana kurang usaha, tetapi kerana konsep, istilah, maksud formula atau hubungan pengetahuan belum benar-benar terbina.","choiceLabel":"Situasi manakah paling kerap berlaku kepada anda?","choices":["Faham contoh, tetapi tidak tahu apabila bentuk soalan berubah","Ingat formula atau jawapan tetapi tidak boleh terangkan mengapa","Istilah atau konsep asas dalam buku masih kabur","Baru faham, tetapi lupa selepas beberapa hari"],"textLabel":"Tulis satu topik yang baru-baru ini anda rasa ‘macam faham tetapi belum betul-betul faham’:","resultLabel":"Anda sudah mengenal pasti satu titik kefahaman yang sebenar"},{"title":"Soalan 2｜Buktikan Kefahaman dengan Kata-Kata Sendiri","intro":"‘Nampak faham’ tidak sama dengan ‘boleh menerangkan’. Hari ini anda perlu menerangkan ilmu itu.","lesson":"Inti kaedah Feynman: jangan salin buku; terangkan dengan bahasa mudah. Bahagian yang sukar diterangkan ialah bahagian yang perlu diperbaiki.","choiceLabel":"Kaedah manakah paling membuktikan bahawa anda benar-benar faham?","choices":["Baca halaman yang sama tiga kali","Salin nota dengan lebih cantik","Tutup buku dan terangkan dengan kata-kata sendiri","Hafal jawapan dahulu"],"correct":2,"textLabel":"Pilih satu konsep dan terangkan dengan kata-kata anda sendiri:","good":"✅ Betul. Inilah cara menguji kefahaman sebenar.","retry":"💡 Kaedah yang lebih kuat ialah menutup buku dan menerangkan sendiri, bukan sekadar membaca berulang kali."},{"title":"Soalan 3｜Tukar Kefahaman kepada Tindakan 25 Minit","intro":"Jangan hanya tulis ‘saya mahu kukuhkan asas’. Tukarkan kepada satu tugasan kecil yang boleh dibuat hari ini.","lesson":"Tugasan membaiki asas yang baik perlu jelas: masa mula, subjek, satu konsep dan tanda bahawa tugasan itu selesai.","timeLabel":"Pukul berapa anda akan mula hari ini?","subjectLabel":"Subjek mana yang mahu diperbaiki?","taskLabel":"Dalam 25 minit, konsep khusus apa yang mahu anda fahami atau siapkan?","distractionLabel":"Gangguan mana paling perlu dialihkan sebelum mula?","distractions":["Notifikasi telefon","Melihat jawapan sambil membuat latihan","Membuka terlalu banyak bahan serentak","Chat / permainan","Gangguan lain"]},{"title":"Soalan 4｜Gunakan Ujian Kecil untuk Mengesan Jurang","intro":"Sama ada anda benar-benar faham atau tidak perlu dibuktikan melalui jawapan sendiri, bukan rasa ‘biasa melihatnya’.","lesson":"Jika jawapan salah, jangan terus lihat jawapan. Tentukan dahulu sama ada konsep tidak faham, ingatan lemah, tidak tahu aplikasi atau salah baca soalan.","qLabel":"Tulis satu soalan atau topik yang anda mahu gunakan untuk menguji diri:","reasonLabel":"Jika jawapan anda salah, punca paling mungkin ialah?","reasons":["Konsep asas belum benar-benar faham","Ingatan belum kukuh","Tidak tahu mengaplikasikan konsep pada soalan baharu","Salah membaca soalan","Lain-lain"],"fixLabel":"Bagaimana anda akan membaiki jurang ini dan menguji diri semula?"},{"title":"Soalan 5｜Bina Pelan 30 Hari untuk Mengukuhkan Asas","intro":"Tukar titik lemah yang ditemui hari ini menjadi latihan yang boleh diulang selama 30 hari.","lesson":"Jangan tulis matlamat seperti ‘jadi lebih pandai’. Gunakan perubahan yang boleh dilihat: boleh menerangkan, boleh buat sendiri, boleh jawab soalan baharu, dan masih ingat selepas beberapa hari.","subjectLabel":"Subjek yang paling ingin dikuatkan dalam 30 hari","goalLabel":"Masalah kefahaman asas mana yang mahu diperbaiki dahulu?","goals":["Kukuhkan satu asas yang lemah","Belajar menerangkan ilmu dengan kata sendiri","Kurangkan masalah ‘soalan berubah terus tidak tahu’","Tingkatkan daya ingatan","Boleh buat soalan asas secara berdikari"],"minutesLabel":"Berapa lama anda boleh belajar secara konsisten setiap hari?","measureLabel":"Selepas 30 hari, bukti apa yang akan menunjukkan bahawa anda benar-benar lebih faham?"}],"B":[{"title":"Soalan 1｜Kenal Pasti Kaedah Belajar yang Kurang Berkesan","intro":"Banyak masa belajar tidak semestinya bermaksud kaedah itu berkesan. Lihat dahulu cara anda mengulang kaji.","lesson":"Corak biasa yang kurang berkesan: hanya membaca semula, menyalin nota, melihat jawapan atau membuat banyak soalan tanpa menganalisis kesilapan.","choiceLabel":"Situasi manakah paling kerap berlaku?","choices":["Membaca buku atau nota berulang kali","Menyalin nota dengan lengkap tetapi jarang menguji diri","Selepas salah, hanya melihat jawapan betul dan teruskan","Membuat banyak soalan tetapi tidak menganalisis sebab kesilapan"],"textLabel":"Tulis satu contoh apabila anda belajar lama tetapi masih belum benar-benar menguasainya:","resultLabel":"Anda sudah mengenal pasti satu tabiat belajar yang perlu dinaik taraf"},{"title":"Soalan 2｜Naik Taraf Ulang Kaji kepada Active Recall","intro":"Hari ini jangan hanya melihat bahan. Biarkan otak mencari jawapan sendiri dahulu.","lesson":"Active recall lebih jelas menunjukkan apa yang anda tahu dan tidak tahu. Jawab tanpa melihat, semak, cari jurang, belajar semula dan uji semula.","choiceLabel":"Kaedah ulang kaji mana paling baik menguji penguasaan sebenar?","choices":["Baca buku sekali lagi","Salin semula isi penting","Tutup bahan dan jawab soalan / buat latihan sendiri","Baca jawapan sehingga rasa biasa"],"correct":2,"textLabel":"Tulis satu soalan yang boleh anda gunakan untuk menguji diri hari ini:","good":"✅ Betul. Active recall membantu anda melihat apa yang benar-benar sudah dan belum dikuasai.","retry":"💡 Cara yang lebih berkesan ialah cuba menjawab tanpa melihat bahan, kemudian semak jurang."},{"title":"Soalan 3｜Buat Eksperimen Kaedah 25 Minit","intro":"Jangan ubah semuanya sekali gus. Uji satu kaedah belajar yang lebih berkesan hari ini.","lesson":"Pilih satu subjek, satu tugasan, satu blok fokus 25 minit dan singkirkan gangguan terbesar. Kemudian lihat apa yang benar-benar siap.","timeLabel":"Pukul berapa eksperimen belajar ini bermula?","subjectLabel":"Subjek","taskLabel":"Dalam 25 minit, satu tugasan apa yang akan disiapkan?","distractionLabel":"Untuk menguji kaedah dengan adil, gangguan mana perlu ditutup dahulu?","distractions":["Notifikasi telefon","Permainan","YouTube / video pendek","Chat","Membuat tugasan lain serentak"]},{"title":"Soalan 4｜Bina Kitaran Kesilapan → Punca → Uji Semula","intro":"Kesilapan belum selesai hanya dengan melihat jawapan. Pastikan kesilapan yang sama tidak berulang.","lesson":"Kenal pasti jenis kesilapan, tulis kaedah betul, kemudian buat semula tanpa melihat jawapan selepas sedikit masa.","qLabel":"Tulis satu soalan atau topik yang baru-baru ini anda jawab salah:","reasonLabel":"Punca utama kesilapan itu ialah?","reasons":["Cuai","Tidak tahu","Salah langkah","Salah konsep","Salah baca soalan / masalah masa"],"fixLabel":"Bagaimana anda akan membaikinya dan menguji semula diri anda?"},{"title":"Soalan 5｜Bina Pelan Kaedah Belajar 30 Hari","intro":"Pilih sedikit kaedah yang berkesan dan amalkan selama 30 hari daripada selalu menukar kaedah.","lesson":"Nyatakan masalah utama, masa yang ada dan bukti kemajuan supaya keberkesanan kaedah boleh dinilai.","subjectLabel":"Subjek yang paling ingin diperbaiki dalam 30 hari","goalLabel":"Kaedah belajar mana yang paling ingin dinaik taraf dahulu?","goals":["Kurangkan hanya membaca tanpa menguji","Bina tabiat active recall","Bina tabiat analisis kesilapan","Tingkatkan kualiti fokus","Belajar menilai sama ada saya benar-benar menguasai sesuatu"],"minutesLabel":"Berapa lama anda boleh belajar secara konsisten setiap hari?","measureLabel":"Bukti apa yang akan menunjukkan bahawa kaedah baharu lebih berkesan daripada sebelumnya?"}],"C":[{"title":"Soalan 1｜Cari Kebocoran Masa Terbesar Anda","intro":"Pengurusan masa bukan memenuhi seluruh hari. Mula dengan mengetahui ke mana masa anda hilang.","lesson":"Penangguhan, tugasan terlalu besar, masa mula tidak jelas, telefon dan rancangan saat akhir membuat banyak rancangan tetapi sedikit yang siap.","choiceLabel":"Situasi manakah paling serupa dengan anda?","choices":["Tahu apa perlu dibuat tetapi selalu lambat mula","Banyak merancang tetapi tiada masa mula yang jelas","Telefon / permainan / video pendek selalu mengganggu","Tugasan terlalu besar dan saya tidak tahu langkah pertama"],"textLabel":"Tulis satu situasi sebenar apabila anda merancang untuk belajar tetapi akhirnya tidak siap:","resultLabel":"Anda sudah mengenal pasti kebocoran masa utama"},{"title":"Soalan 2｜Tentukan Keutamaan, Bukan Sekadar Buat yang Mudah","intro":"Apabila masa terhad, lindungi tugasan bernilai tinggi dahulu.","lesson":"Bezakan perkara wajib, patut dibuat dan perkara yang anda mahu lakukan. Jangan biar tugas kecil mengambil masa belajar yang paling penting.","choiceLabel":"Jika ada kerja sekolah, ulang kaji dan hiburan hari ini, susunan mana paling baik?","choices":["Buat yang paling mudah dahulu dan tangguh yang penting","Mulakan semua serentak","Siapkan yang wajib, lindungi ulang kaji paling penting, kemudian baru hiburan","Tunggu mood baru tentukan"],"correct":2,"textLabel":"Tulis satu hasil pembelajaran paling penting yang mesti siap hari ini:","good":"✅ Betul. Pengurusan masa bermula dengan keutamaan, bukan memenuhi setiap minit.","retry":"💡 Tentukan perkara wajib dan tugas paling penting dahulu, kemudian baru susun hiburan dan tugas lain."},{"title":"Soalan 3｜Bina Titik Mula Belajar yang Tetap","intro":"Jangan tunggu motivasi. Beri pembelajaran satu pencetus yang tetap.","lesson":"Masa mula tetap + tugasan jelas + gangguan dialihkan lebih mudah dilaksanakan berbanding ‘belajar bila ada masa’.","timeLabel":"Pukul berapa anda akan mula hari ini?","subjectLabel":"Subjek pertama?","taskLabel":"Dalam 25 minit pertama, apa satu tugasan yang akan disiapkan?","distractionLabel":"Gangguan mana mesti diurus sebelum mula?","distractions":["Notifikasi telefon","Permainan","YouTube / video pendek","Chat","Meja / bahan terlalu berselerak"]},{"title":"Soalan 4｜Pecahkan Tugasan yang Ditangguh kepada Langkah Kecil","intro":"Tugasan yang kabur dan terlalu besar mudah menyebabkan penangguhan.","lesson":"‘Ulang kaji Sains’ terlalu besar; ‘buka Bab 3 dan buat 5 soalan pertama’ boleh dimulakan sekarang.","qLabel":"Tulis satu tugasan yang sudah lama anda tangguhkan:","reasonLabel":"Mengapa anda paling mudah menangguh tugasan itu?","reasons":["Tugasan terlalu besar","Tidak tahu langkah pertama","Takut salah / terlalu sukar","Telefon atau hiburan menarik perhatian","Masa mula tidak jelas"],"fixLabel":"Tulis semula sebagai langkah pertama yang boleh dimulakan dalam 10 minit:"},{"title":"Soalan 5｜Bina Pelan Pengurusan Masa 30 Hari","intro":"Matlamatnya bukan menjadi sibuk setiap hari tetapi menyiapkan tugas penting dengan lebih konsisten.","lesson":"Pilih satu fokus, satu waktu belajar stabil dan satu ukuran seperti jumlah penangguhan, kadar siap atau gangguan.","subjectLabel":"Subjek yang paling perlu dilindungi masanya dalam 30 hari","goalLabel":"Masalah masa mana yang paling ingin diperbaiki dahulu?","goals":["Kurangkan penangguhan","Bina masa mula yang tetap","Kurangkan gangguan telefon / permainan","Tingkatkan kadar pelan yang siap","Belajar mengutamakan tugas"],"minutesLabel":"Berapa minit masa belajar yang boleh anda lindungi setiap hari?","measureLabel":"Selepas 30 hari, data apa yang akan menunjukkan pengurusan masa anda bertambah baik?"}],"D":[{"title":"Soalan 1｜Cari Jenis Markah Peperiksaan yang Paling Kerap Hilang","intro":"Jangan hanya tulis ‘saya mahu lebih rajin’. Cari dahulu di mana markah sebenarnya hilang.","lesson":"Punca biasa termasuk cuai, salah baca soalan, tertinggal langkah, tidak faham konsep, masa tidak cukup dan gementar.","choiceLabel":"Apakah punca kehilangan markah yang paling kerap berlaku kepada anda?","choices":["Cuai / salah salin / salah kira","Salah faham soalan atau terlepas kata kunci","Langkah tidak lengkap atau kaedah tidak tersusun","Masa tidak cukup / terlalu lama pada satu soalan","Gementar dan tidak dapat buat perkara yang sebenarnya tahu"],"textLabel":"Tulis satu soalan atau situasi apabila anda sebenarnya boleh dapat markah tetapi kehilangannya:","resultLabel":"Anda sudah mengenal pasti satu sumber markah yang boleh diperbaiki"},{"title":"Soalan 2｜Baca Soalan Dahulu, Baru Tentukan Cara Menjawab","intro":"Banyak markah hilang bukan kerana tidak tahu, tetapi kerana terlalu cepat mula mengira atau menulis.","lesson":"Cari kata kunci, kenal pasti apa yang diminta dan lihat markah sebelum memilih langkah dan masa.","choiceLabel":"Apabila melihat satu soalan peperiksaan, cara mana paling stabil?","choices":["Terus tulis secepat mungkin","Lihat pilihan jawapan dahulu dan agak kehendak soalan","Baca, cari kata kunci dan kehendak soalan, kemudian pilih langkah","Buat bahagian paling sukar dahulu"],"correct":2,"textLabel":"Tulis satu soalan yang anda akan tanya diri sendiri setiap kali membaca soalan peperiksaan:","good":"✅ Betul. Fahami tugasan dahulu sebelum menjawab untuk mengurangkan markah yang hilang tanpa perlu.","retry":"💡 Cara lebih stabil ialah memahami kehendak, kata kunci dan markah sebelum mula menjawab."},{"title":"Soalan 3｜Lakukan Satu Latihan Berjangka Masa","intro":"Strategi peperiksaan perlu dilatih sebelum masuk dewan peperiksaan.","lesson":"Gunakan satu blok masa kecil: tetapkan masa, jenis soalan, sasaran dan satu langkah semakan supaya ‘tahu’ boleh ditukar menjadi markah dalam masa terhad.","timeLabel":"Pukul berapa latihan berjangka masa ini bermula?","subjectLabel":"Subjek","taskLabel":"Dalam 25 minit, set soalan / tugasan peperiksaan apa yang akan disiapkan?","distractionLabel":"Untuk simulasi peperiksaan, gangguan mana perlu dialihkan?","distractions":["Telefon","Semak jawapan semasa membuat","Chat","Melihat bahan lain semasa menjawab","Gangguan lain"]},{"title":"Soalan 4｜Tukar Satu Kehilangan Markah kepada Strategi Seterusnya","intro":"Perkara paling bernilai selepas peperiksaan ialah tahu apa yang perlu diubah seterusnya.","lesson":"Untuk setiap kehilangan markah: apa salahnya, mengapa berlaku, bagaimana mencegahnya, dan bila hendak melatih semula.","qLabel":"Tulis satu soalan peperiksaan / situasi kehilangan markah yang patut dianalisis:","reasonLabel":"Punca utama kehilangan markah itu?","reasons":["Cuai","Salah baca soalan","Langkah / penerangan tidak lengkap","Konsep tidak tahu","Masa / gementar"],"fixLabel":"Dalam latihan atau peperiksaan seterusnya, langkah pencegahan khusus apa yang akan anda gunakan?"},{"title":"Soalan 5｜Bina Pelan Peningkatan Peperiksaan 30 Hari","intro":"Latih satu corak kehilangan markah utama secara konsisten selama 30 hari.","lesson":"Markah tinggi bukan hanya lebih banyak soalan. Jadikan bacaan soalan, masa, langkah, semakan dan analisis kesilapan satu proses yang stabil.","subjectLabel":"Subjek yang paling ingin ditingkatkan dalam 30 hari","goalLabel":"Masalah peperiksaan mana yang paling ingin diperbaiki dahulu?","goals":["Kurangkan kehilangan markah kerana cuai","Tingkatkan ketepatan membaca soalan","Baiki agihan masa","Dapatkan semula markah langkah / penerangan","Kurangkan kesan gementar"],"minutesLabel":"Berapa lama anda boleh berlatih secara konsisten setiap hari?","measureLabel":"Selepas 30 hari, bagaimana anda akan tahu bahawa kehilangan markah benar-benar berkurang?"}],"E":[{"title":"Soalan 1｜Cari Bahagian yang Paling Bergantung pada Peringatan Orang Lain","intro":"Pembelajaran kendiri bukan bermaksud membuat semuanya sendiri; ia bermula dengan tahu apa langkah seterusnya.","lesson":"Jika sentiasa menunggu ibu bapa, guru atau AI memberi arahan, sukar untuk membina pertimbangan belajar sendiri.","choiceLabel":"Situasi manakah paling menyerupai anda sekarang?","choices":["Sukar mula jika tiada siapa mengingatkan","Apabila tidak tahu, terus bertanya orang lain","Apabila sukar, terus minta AI beri jawapan","Tidak jelas kelemahan utama sendiri","Pelan belajar biasanya disusun oleh orang lain"],"textLabel":"Tulis satu situasi baru-baru ini yang mungkin tidak anda lakukan tanpa peringatan:","resultLabel":"Anda sudah menemui satu tempat untuk mula melatih pembelajaran kendiri"},{"title":"Soalan 2｜Fikir Sendiri Dahulu, Kemudian Baru Minta Bantuan","intro":"Meminta bantuan itu penting, tetapi tinggalkan pemikiran sendiri sebelum meminta bantuan.","lesson":"Urutan dicadangkan: cuba sendiri → tulis titik tersekat → minta petunjuk → siapkan sendiri → terangkan semula.","choiceLabel":"Apabila tidak tahu menjawab, cara mana paling membina pembelajaran kendiri?","choices":["Terus minta AI beri jawapan penuh","Langkau dan biarkan sahaja","Cuba dahulu, tulis titik tersekat, minta petunjuk, kemudian siapkan sendiri","Lihat cara orang lain dan salin"],"correct":2,"textLabel":"Tulis satu soalan yang akan anda tanya diri sendiri apabila tersekat nanti:","good":"✅ Betul. Tinggalkan pemikiran sendiri dahulu sebelum meminta bantuan untuk benar-benar berkembang.","retry":"💡 Pembelajaran kendiri bukan menolak bantuan; cuba sendiri dahulu, kemudian minta petunjuk yang sesuai."},{"title":"Soalan 3｜Mulakan Satu Sesi Belajar atas Keputusan Sendiri","intro":"Hari ini jangan tunggu peringatan. Anda sendiri tentukan masa mula dan tugasan pertama.","lesson":"Latih urutan: saya tentukan → saya mula → saya semak. Mulakan dengan satu tugasan kecil 25 minit.","timeLabel":"Anda tentukan sendiri: pukul berapa mula?","subjectLabel":"Anda pilih subjek mana dahulu?","taskLabel":"Dalam 25 minit, apa yang anda putuskan untuk siapkan?","distractionLabel":"Untuk bertanggungjawab kepada diri sendiri, gangguan mana akan ditutup dahulu?","distractions":["Notifikasi telefon","Permainan","YouTube / video pendek","Chat","Gangguan lain"]},{"title":"Soalan 4｜Bina Peraturan Sendiri untuk Bantuan dan AI","intro":"Pelajar berdikari bukan tidak pernah bertanya, tetapi tahu bila perlu cuba sendiri dan bila patut meminta bantuan.","lesson":"Permintaan bantuan yang baik membawa maklumat: apa yang saya sudah cuba, di mana saya tersekat, dan saya perlukan petunjuk, penjelasan atau semakan.","qLabel":"Tulis satu soalan yang baru-baru ini anda mahu terus tanya orang lain atau AI:","reasonLabel":"Mengapa anda mahu meminta bantuan dengan segera?","reasons":["Tidak tahu dari mana hendak mula","Takut salah","Mahu cepat siap","Konsep memang tidak faham","Sudah biasa bertanya orang / AI dahulu"],"fixLabel":"Tulis peraturan baharu anda: apa yang akan anda cuba dahulu dan bila baru meminta bantuan?"},{"title":"Soalan 5｜Bina Pelan Pembelajaran Kendiri 30 Hari","intro":"Matlamatnya bukan tidak bergantung pada sesiapa langsung, tetapi semakin mampu mengesan masalah, memilih tindakan dan menyemak hasil sendiri.","lesson":"Pilih satu subjek utama, satu tabiat berdikari dan satu cara mengukur kemajuan selama 30 hari.","subjectLabel":"Subjek yang paling sesuai untuk melatih pembelajaran kendiri dalam 30 hari","goalLabel":"Keupayaan kendiri mana yang paling ingin dibina dahulu?","goals":["Mula tanpa perlu diingatkan","Cuba sendiri sebelum meminta bantuan","Susun keutamaan sendiri","Kurangkan kebergantungan pada jawapan terus AI","Semak hasil pembelajaran sendiri"],"minutesLabel":"Berapa lama anda sanggup melatih pembelajaran kendiri setiap hari?","measureLabel":"Selepas 30 hari, bukti apa yang akan menunjukkan bahawa anda lebih berdikari?"}]},"en":{"A":[{"title":"Question 1｜Find the Exact Concept You Are Stuck On","intro":"Do not rush into more practice. First identify exactly what you do not understand yet.","lesson":"Foundation problems are often not about effort. A concept, keyword, formula meaning or connection between ideas may not be fully built yet.","choiceLabel":"Which situation happens most often to you?","choices":["I understand the example, but get stuck when the question changes","I remember a formula or answer, but cannot explain why it works","The basic keywords or concepts themselves are unclear","I understand it today, then forget it a few days later"],"textLabel":"Write one recent topic that you only partly understand:","resultLabel":"You have identified one real understanding gap"},{"title":"Question 2｜Prove Understanding in Your Own Words","intro":"Looking familiar is not the same as being able to explain it. Today you will explain the idea yourself.","lesson":"The Feynman approach is simple: do not copy the textbook. Explain the idea in simple language. Anything you cannot explain clearly becomes your next repair target.","choiceLabel":"Which action best proves real understanding?","choices":["Read the same page three more times","Copy the notes more neatly","Close the book and explain it in my own words","Memorise the answer first"],"correct":2,"textLabel":"Choose one concept and explain it in your own words:","good":"✅ Correct. This is a real check of understanding.","retry":"💡 A stronger method is to close the book and explain it yourself instead of only rereading."},{"title":"Question 3｜Turn Understanding into One 25-Minute Action","intro":"Do not just write ‘improve my basics’. Turn it into one small task you can do today.","lesson":"A good foundation-repair task is specific: start time, subject, one concept and a clear finish condition.","timeLabel":"What time will you start today?","subjectLabel":"Which subject will you strengthen?","taskLabel":"In 25 minutes, which exact concept will you understand or what will you complete?","distractionLabel":"Which distraction should be removed first?","distractions":["Phone notifications","Checking answers while working","Opening too many resources at once","Chat / games","Other distraction"]},{"title":"Question 4｜Use a Small Test to Find the Knowledge Gap","intro":"Real understanding must be shown by answering for yourself, not by feeling that the material looks familiar.","lesson":"If you get it wrong, do not only read the answer. Decide whether the problem is concept, memory, application or question-reading, then repair and retest.","qLabel":"Write one question or topic you will use to test yourself:","reasonLabel":"If you get it wrong, what is the most likely reason?","reasons":["The basic concept is not truly understood","Memory is not strong enough","I cannot apply the concept to a new question","I misread the question","Other"],"fixLabel":"How will you repair this gap and test yourself again?"},{"title":"Question 5｜Build a 30-Day Foundation-Understanding Plan","intro":"Turn the gap you found today into a repeatable 30-day training plan.","lesson":"Do not use a vague goal like ‘get smarter’. Choose visible evidence: explain clearly, solve independently, handle changed questions, or remember after several days.","subjectLabel":"Subject you most want to strengthen in the next 30 days","goalLabel":"Which foundation-understanding problem do you want to improve first?","goals":["Repair one weak foundation","Explain knowledge in my own words","Reduce ‘I cannot do it when the question changes’","Improve memory retention","Solve basic questions independently"],"minutesLabel":"How much stable time can you invest each day?","measureLabel":"After 30 days, what evidence will prove that you truly understand more?"}],"B":[{"title":"Question 1｜Find Your Most Common Ineffective Study Method","intro":"Spending a lot of time does not guarantee effective learning. First look at how you usually revise.","lesson":"Common low-value patterns include rereading, copying notes, checking answers immediately and doing many questions without analysing mistakes.","choiceLabel":"Which situation happens most often?","choices":["I keep rereading textbooks or notes","I make complete notes but rarely test myself","After a mistake, I only check the correct answer and move on","I do many questions but do not analyse why I got them wrong"],"textLabel":"Write one recent example of studying for a long time without really mastering it:","resultLabel":"You have identified one study habit that needs an upgrade"},{"title":"Question 2｜Upgrade Revision to Active Recall","intro":"Today, do not only look at information. Make your brain retrieve the answer first.","lesson":"Active recall shows what you truly know. Answer without looking, check the gap, relearn and retest.","choiceLabel":"Which revision method best checks real mastery?","choices":["Read the textbook again","Copy the key points again","Close the material and answer questions / practise independently","Read the answers until they feel familiar"],"correct":2,"textLabel":"Write one question you can use to test yourself today:","good":"✅ Correct. Active recall reveals what is actually strong and what still needs work.","retry":"💡 A stronger method is to answer without looking first, then check the gap."},{"title":"Question 3｜Run One 25-Minute Method Experiment","intro":"Do not change everything at once. Test one better learning method today.","lesson":"Choose one subject, one task, one 25-minute focus block and remove the biggest distraction. Then look at what you actually completed.","timeLabel":"What time will this learning-method experiment start?","subjectLabel":"Subject","taskLabel":"What one learning task will you complete in 25 minutes?","distractionLabel":"Which distraction should you remove so the experiment is fair?","distractions":["Phone notifications","Games","YouTube / short videos","Chat","Doing another task at the same time"]},{"title":"Question 4｜Build a Mistake → Cause → Retest Loop","intro":"A mistake is not finished when you read the answer. Make sure the same mistake is less likely next time.","lesson":"Classify the error, write the correct method, then later redo it without looking at the answer.","qLabel":"Write one recent wrong question or topic:","reasonLabel":"What was the main cause?","reasons":["Carelessness","Do not know","Wrong steps","Concept error","Question-reading / time problem"],"fixLabel":"How will you repair it and retest yourself?"},{"title":"Question 5｜Build a 30-Day Effective-Study Plan","intro":"A few effective methods practised for 30 days are more useful than constantly changing methods.","lesson":"Define the main problem, stable daily time and evidence of improvement so you can test whether the method works.","subjectLabel":"Subject you most want to improve in the next 30 days","goalLabel":"Which learning method do you want to upgrade first?","goals":["Stop only rereading without testing","Build an active-recall habit","Build a mistake-review habit","Improve focused-study quality","Learn how to judge whether I truly mastered something"],"minutesLabel":"How much stable study time can you give each day?","measureLabel":"What evidence will show that the new method works better than your old one?"}],"C":[{"title":"Question 1｜Find Your Biggest Time Leak","intro":"Time management is not about filling the whole day. Start by seeing where your time is actually leaking.","lesson":"Procrastination, oversized tasks, unclear start times, phone distractions and last-minute decisions can produce lots of plans but little completion.","choiceLabel":"Which situation sounds most like you?","choices":["I know what to do but keep delaying the start","I make many plans but do not set a clear start time","Phone / games / short videos keep interrupting me","The task feels too big and I do not know the first step"],"textLabel":"Write one real situation when you planned to study but did not complete it:","resultLabel":"You have identified your main time leak"},{"title":"Question 2｜Choose Priorities, Not Just Easy Tasks","intro":"When time is limited, protect high-value tasks first.","lesson":"Separate must-do, should-do and want-to-do. Do not let small tasks consume the time meant for the most important learning.","choiceLabel":"If you have homework, revision and entertainment today, which order is best?","choices":["Do the easiest thing first and leave important work for later","Start all three at the same time","Finish must-do work, protect the most important revision, then schedule entertainment","Wait until I feel motivated"],"correct":2,"textLabel":"Write the single most important learning outcome you need today:","good":"✅ Correct. Time management starts with priorities, not a fully packed schedule.","retry":"💡 Decide the must-do and most important task first, then fit entertainment and other tasks around them."},{"title":"Question 3｜Create a Fixed Study Start Point","intro":"Do not wait for motivation. Give study a reliable trigger.","lesson":"A fixed start time + clear task + removed distraction is easier to follow than ‘I’ll study when I have time’.","timeLabel":"What time will you start today?","subjectLabel":"Which subject comes first?","taskLabel":"What one task will you complete in the first 25 minutes?","distractionLabel":"Which distraction must be handled before you begin?","distractions":["Phone notifications","Games","YouTube / short videos","Chat","Messy desk / materials"]},{"title":"Question 4｜Shrink a Procrastinated Task until You Can Start Now","intro":"The bigger and less specific a task feels, the easier it is to delay.","lesson":"‘Revise Science’ is too large; ‘open Chapter 3 and do the first 5 questions’ can start immediately.","qLabel":"Write one task you have been putting off:","reasonLabel":"Why do you delay it most?","reasons":["The task is too big","I do not know the first step","I am afraid of getting it wrong / it feels too difficult","Phone or entertainment pulls me away","The start time is unclear"],"fixLabel":"Rewrite it as a first step you can begin within 10 minutes:"},{"title":"Question 5｜Build a 30-Day Time-Management Plan","intro":"The goal is not to stay busy every day. It is to complete important work more consistently.","lesson":"Choose one priority, one stable study block and one measure such as procrastination count, completion rate or distraction count.","subjectLabel":"Subject whose study time most needs protecting in the next 30 days","goalLabel":"Which time-management problem do you want to improve first?","goals":["Reduce procrastination","Build a fixed start time","Reduce phone / game distractions","Improve plan completion rate","Learn to prioritise tasks"],"minutesLabel":"How much study time can you reliably protect each day?","measureLabel":"After 30 days, what data will show that your time management improved?"}],"D":[{"title":"Question 1｜Find the Exam Marks You Lose Most Often","intro":"Do not just say ‘I need to work harder’. First find where the marks are actually leaking.","lesson":"Common mark loss includes carelessness, misreading, missing steps, weak concepts, poor time allocation and nerves. Different causes need different strategies.","choiceLabel":"Which reason most often costs you marks?","choices":["Careless copying / calculation mistakes","Misreading the question or missing keywords","Incomplete steps or disorganised working","Running out of time / spending too long on one question","Nerves causing mistakes on things I actually know"],"textLabel":"Write one recent question or situation where you could have earned the marks but lost them:","resultLabel":"You have identified one recoverable source of lost marks"},{"title":"Question 2｜Read the Question before Choosing How to Answer","intro":"Many marks are lost not because students do not know the content, but because they start answering too quickly.","lesson":"Identify keywords, what the question asks and the marks available before choosing your steps and time.","choiceLabel":"When you see an exam question, which approach is most reliable?","choices":["Start writing immediately—the faster the better","Look at the answer choices first and guess what is being asked","Read, find the keywords and requirement, then choose the steps","Start with the hardest part to prove I can do it"],"correct":2,"textLabel":"Write one question you will ask yourself whenever you read an exam question:","good":"✅ Correct. Understand the task before answering to reduce avoidable mark loss.","retry":"💡 A more reliable approach is to identify the requirement, keywords and marks before you answer."},{"title":"Question 3｜Do One Timed Practice","intro":"Exam strategy should be trained before the actual exam.","lesson":"Use a small timed block: choose the time, question set, target and checking step so ‘I know it’ becomes ‘I can score within the time limit’.","timeLabel":"What time will this timed practice start?","subjectLabel":"Subject","taskLabel":"Which question set / exam task will you complete in 25 minutes?","distractionLabel":"To simulate exam conditions, which distraction should be removed?","distractions":["Phone","Checking answers while working","Chat","Looking at other notes while answering","Other distraction"]},{"title":"Question 4｜Turn One Lost Mark into a Next-Time Strategy","intro":"The most valuable thing after an exam is knowing exactly what to change next time.","lesson":"For each mark lost: what went wrong, why, how to prevent it, and when to practise again.","qLabel":"Write one exam question / mark-loss situation worth reviewing:","reasonLabel":"What was the main cause?","reasons":["Carelessness","Misreading the question","Incomplete steps / explanation","Concept not known","Time / nerves"],"fixLabel":"What specific prevention step will you add in the next practice or exam?"},{"title":"Question 5｜Build a 30-Day Exam-Improvement Plan","intro":"Train one major mark-loss pattern consistently for 30 days.","lesson":"Higher marks are not only about more questions. Build stable routines for question reading, time, steps, checking and mistake review.","subjectLabel":"Subject you most want to improve in the next 30 days","goalLabel":"Which exam problem do you want to improve first?","goals":["Reduce careless mark loss","Improve question-reading accuracy","Improve time allocation","Recover method / explanation marks","Reduce the effect of exam nerves"],"minutesLabel":"How much stable practice time can you give each day?","measureLabel":"After 30 days, how will you know that lost marks have genuinely decreased?"}],"E":[{"title":"Question 1｜Find Where You Depend Most on Other People’s Reminders","intro":"Independent learning does not mean doing everything alone. It starts with being able to judge your own next step.","lesson":"If you always wait for a parent, teacher or AI to tell you what to do next, your own learning judgement stays weak.","choiceLabel":"Which situation sounds most like you now?","choices":["I struggle to start if nobody reminds me","When I get stuck, I immediately ask someone","When work is difficult, I ask AI for the answer","I am not clear about my weakest area","My study plan is usually made by someone else"],"textLabel":"Write one recent learning situation that you probably would not have started without a reminder:","resultLabel":"You have found one place to begin building independence"},{"title":"Question 2｜Think First, Then Ask for Help","intro":"Asking for help is useful, but leave evidence of your own thinking before you ask.","lesson":"Suggested order: try → write the exact stuck point → ask for a hint → finish it yourself → explain it again.","choiceLabel":"When you cannot answer a question, which action best builds independent learning?","choices":["Ask AI for the full answer immediately","Skip it and leave it","Try first, write where I am stuck, ask for a hint, then finish it myself","Watch someone else do it and copy"],"correct":2,"textLabel":"Write one question you will ask yourself the next time you get stuck:","good":"✅ Correct. Do your own thinking first, then use help to strengthen it.","retry":"💡 Independent learning is not refusing help. Try first, then ask for an appropriate hint."},{"title":"Question 3｜Start One Study Session by Your Own Decision","intro":"Today, do not wait for a reminder. You choose the start time and first task yourself.","lesson":"Practise: I decide → I start → I check. Begin with one small 25-minute task.","timeLabel":"You decide: what time will you start?","subjectLabel":"Which subject will you choose first?","taskLabel":"What will you decide to complete in 25 minutes?","distractionLabel":"To take responsibility for your own plan, which distraction will you remove?","distractions":["Phone notifications","Games","YouTube / short videos","Chat","Other distraction"]},{"title":"Question 4｜Create Your Own Help-and-AI Rule","intro":"An independent learner is not someone who never asks. They know when to think alone and when to ask for help.","lesson":"A strong help request includes: what I tried, exactly where I am stuck, and whether I need a hint, explanation or check.","qLabel":"Write one recent question you wanted to ask another person or AI immediately:","reasonLabel":"Why did you want help straight away?","reasons":["I did not know where to start","I was afraid of being wrong","I wanted to finish quickly","I genuinely did not understand the concept","I am used to asking someone / AI first"],"fixLabel":"Write your new rule: what will you try first, and when will you ask for help?"},{"title":"Question 5｜Build a 30-Day Independent-Learning Plan","intro":"The goal is not to rely on nobody. It is to become better at spotting problems, choosing actions and checking results yourself.","lesson":"Choose one focus subject, one independence habit and one measure of progress for 30 days.","subjectLabel":"Subject you most want to use to practise independent learning","goalLabel":"Which independent-learning ability do you want to build first?","goals":["Start without reminders","Try by myself before asking for help","Set my own priorities","Reduce dependence on direct AI answers","Check my own learning results"],"minutesLabel":"How much time will you give to independent-learning practice each day?","measureLabel":"After 30 days, what evidence will prove that you are more independent?"}]}};

["A","当孩子成绩不好或做错时，我很容易先批评、讲道理或马上指出问题，而不是先听他说发生了什么。"],["A","我们谈学习时，常常很快变成争执、催促或孩子不想继续说。"],["A","我比较常问“考几分、做完了吗”，较少问“哪里最难、你怎样想、需要什么帮助”。"],
["B","家里的学习时间常常临时决定，没有比较稳定的开始时间或学习环境。"],["B","手机、电视、游戏或家庭活动经常打断孩子原本的学习安排。"],["B","孩子常常到考试前才集中复习，平时缺少固定复习节奏。"],
["C","如果我不提醒，孩子通常不会主动开始功课或复习。"],["C","孩子遇到不会的题时，我常常直接告诉他答案或步骤，帮助他尽快做完。"],["C","学习计划大多由我安排，孩子很少自己决定今天先做什么或怎样检查完成。"],
["D","考试前，我容易不断提醒成绩、名次或“这次一定要考好”。"],["D","孩子考试失分后，我们比较常关注分数，而不是一起分析粗心、概念、步骤或时间问题。"],["D","孩子考试紧张时，我不太确定怎样帮助他稳定情绪和执行考试步骤。"],
["E","孩子使用 AI 时，我不太清楚怎样判断他是在学习，还是直接让 AI 代做。"],["E","我还没有和孩子建立“先自己想、再问 AI、最后自己解释”的使用规则。"],["E","我担心 AI 让孩子越来越依赖，但又不知道怎样把 AI 变成真正的学习工具。"]],

["A","Apabila anak mendapat keputusan kurang baik atau membuat kesilapan, saya mudah terus mengkritik, memberi nasihat atau menunjukkan masalah sebelum mendengar apa yang sebenarnya berlaku."],["A","Perbualan tentang pembelajaran mudah bertukar menjadi pertengkaran, desakan atau anak tidak mahu bercakap lagi."],["A","Saya lebih kerap bertanya “berapa markah” atau “sudah siap?” berbanding “bahagian mana paling susah?”, “apa yang kamu fikir?” atau “apa bantuan yang kamu perlukan?”"],
["B","Masa belajar di rumah sering ditentukan secara spontan tanpa waktu mula atau persekitaran yang stabil."],["B","Telefon, TV, permainan atau aktiviti keluarga kerap mengganggu rancangan pembelajaran anak."],["B","Anak biasanya hanya belajar dengan serius apabila peperiksaan hampir dan kurang mempunyai rutin ulang kaji tetap."],
["C","Jika saya tidak mengingatkan, anak biasanya tidak akan mula kerja sekolah atau ulang kaji sendiri."],["C","Apabila anak tidak tahu sesuatu soalan, saya sering terus memberi jawapan atau langkah supaya cepat siap."],["C","Kebanyakan pelan belajar disusun oleh saya dan anak jarang menentukan sendiri apa yang hendak dibuat dahulu atau bagaimana hendak menyemak hasil."],
["D","Sebelum peperiksaan, saya mudah mengulang peringatan tentang markah, kedudukan atau bahawa “kali ini mesti dapat keputusan baik”."],["D","Selepas anak kehilangan markah, kami lebih banyak bercakap tentang markah berbanding menganalisis cuai, konsep, langkah atau masalah masa."],["D","Apabila anak gementar ketika peperiksaan, saya kurang pasti bagaimana hendak membantu menstabilkan emosi dan langkah peperiksaan."],

const PARENT_TYPES={
zh:{
A:["沟通与情绪支持","现在最值得先改善的可能不是“讲更多”，而是让孩子愿意把真实困难说出来。先听见问题，才有机会一起解决问题。","一谈学习就争执；孩子说“你不懂”；家长越讲越多，孩子越不想回应。","今晚只问一个问题：『最近学习里，哪一件事最让你觉得麻烦？』先听完，不急着给答案。"],
B:["学习环境与时间系统","家庭支持的重点可以先放在稳定节奏，而不是每天临时催促。环境与开始时间越清楚，执行越容易。","每天开始时间不同；经常被手机或家庭活动打断；考前才突然加大学习量。","和孩子一起定一个固定 25 分钟学习区块，只先执行 7 天，不把整天排满。"],
C:["自主学习与责任","现在可能需要从“家长替孩子管理学习”逐步转向“孩子自己决定、自己尝试、自己检查”。","不提醒就不开始；遇到问题马上求助；孩子会做但缺少主动性。","今天遇到一个问题时，不直接给答案。先问：『你已经试过什么？下一步你想先试哪一个方法？』"],
D:["考试支持与压力","家长可以把关注点从“这次一定要高分”转向“怎样稳定发挥、减少失分、完成过程”。","考试前家庭气氛紧张；孩子容易怕错；考后只谈分数，很少分析具体失分原因。","下一次考试后只做一次 10 分钟复盘：做得好 1 项、失分原因 1 项、下一步 1 项。"],
E:["AI 使用与边界","AI 不需要完全禁止，重点是建立使用顺序：先思考、再求助、最后自己解释与验证。","直接复制 AI 答案；遇到不会马上问 AI；家长不知道怎样判断孩子有没有真正理解。","建立一个家庭 AI 规则：『先自己尝试 5 分钟 → 再问 AI 提示 → 最后不用 AI 自己解释一次。』"]},
ms:{
A:["Komunikasi & Sokongan Emosi","Perkara paling penting mungkin bukan “beri lebih banyak nasihat”, tetapi membantu anak bercakap tentang kesukaran sebenar. Dengarkan dahulu sebelum cuba menyelesaikan.","Perbincangan belajar cepat menjadi tegang; anak berkata “ibu/ayah tidak faham”; semakin banyak ibu bapa bercakap, semakin kurang anak mahu menjawab.","Malam ini tanya satu soalan sahaja: “Dalam pembelajaran kebelakangan ini, perkara apa paling menyusahkan kamu?” Dengar sampai habis tanpa terus memberi jawapan."],
B:["Persekitaran Belajar & Sistem Masa","Fokus keluarga boleh bermula dengan ritma yang stabil, bukan desakan saat akhir. Lagi jelas masa mula dan persekitaran, lagi mudah dilaksanakan.","Waktu mula berubah-ubah; telefon atau aktiviti keluarga sering mengganggu; jumlah belajar meningkat mendadak sebelum peperiksaan.","Tetapkan satu blok belajar 25 minit bersama anak dan cuba kekalkan selama 7 hari dahulu. Jangan penuhkan seluruh hari."],
C:["Pembelajaran Kendiri & Tanggungjawab","Perlu beralih secara beransur daripada “ibu bapa mengurus pembelajaran” kepada “anak memilih, mencuba dan menyemak sendiri”.","Tidak mula tanpa diingatkan; terus meminta bantuan; sebenarnya boleh belajar tetapi kurang inisiatif.","Apabila anak tersekat hari ini, jangan terus beri jawapan. Tanya: “Apa yang sudah kamu cuba? Langkah mana yang kamu mahu cuba seterusnya?”"],
D:["Sokongan Peperiksaan & Tekanan","Alih fokus daripada “mesti dapat markah tinggi” kepada “bagaimana hendak stabil, kurangkan kehilangan markah dan ikuti proses”.","Suasana keluarga tegang sebelum peperiksaan; anak takut membuat kesilapan; selepas peperiksaan hanya bercakap tentang markah.","Selepas peperiksaan seterusnya, buat refleksi 10 minit: 1 perkara yang baik, 1 punca kehilangan markah, 1 langkah seterusnya."],
E:["Penggunaan AI & Sempadan","AI tidak perlu diharamkan sepenuhnya. Yang penting ialah urutan penggunaan: fikir sendiri → minta bantuan → terangkan dan semak sendiri.","Terus salin jawapan AI; tanya AI sebaik sahaja tersekat; sukar tahu sama ada anak benar-benar faham.","Bina satu peraturan keluarga: “Cuba sendiri 5 minit → minta petunjuk AI → akhir sekali terangkan semula tanpa AI.”"]},
en:{
A:["Communication & Emotional Support","The best first improvement may not be “say more,” but helping your child talk about the real difficulty. Listening first makes problem-solving possible.","Learning conversations quickly become arguments; the child says “you don’t understand”; the more the parent talks, the less the child responds.","Tonight ask only one question: “What has been the most difficult part of learning lately?” Listen to the full answer before giving advice."],
B:["Learning Environment & Time System","Family support can begin with a stable rhythm rather than last-minute reminders. Clear start times and environments make action easier.","Study start times change every day; phones/family activities interrupt; study suddenly increases before exams.","Agree on one fixed 25-minute study block and keep it for 7 days first. Do not fill the entire day."],
C:["Independent Learning & Responsibility","The next step may be moving gradually from “parents manage learning” to “the child decides, tries and checks.”","The child does not start without reminders, immediately asks for help, or can learn but lacks initiative.","When your child gets stuck today, do not give the answer immediately. Ask: “What have you tried? What would you like to try next?”"],
D:["Exam Support & Pressure","Shift attention from “you must score high” to “how to perform steadily, reduce lost marks and follow the process.”","Family tension rises before exams; the child fears mistakes; post-exam talks focus only on scores.","After the next exam, do a 10-minute review: 1 thing done well, 1 reason marks were lost, 1 next step."],
E:["AI Use & Boundaries","AI does not need to be banned. The key is an order of use: think first → ask for help → explain and verify independently.","Copying AI answers directly, asking AI immediately, and not knowing whether the child truly understands.","Set one family AI rule: “Try independently for 5 minutes → ask AI for a hint → finally explain it again without AI.”"]}
};

function uuid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}

async function saveStudentDiagnostic(scores,primary,secondary){const identity=getIdentity();if(!identity)return;const payload={id:identity.diagnostic_id,client_session_id:identity.client_session_id,email:identity.email.toLowerCase(),student_name:identity.student_name,grade:identity.grade,primary_type:primary,secondary_type:secondary,score_a:scores.A,score_b:scores.B,score_c:scores.C,score_d:scores.D,score_e:scores.E,answers:sAnswers};localStorage.setItem(DIAGNOSTIC_KEY,JSON.stringify({...payload,created_at:new Date().toISOString()}));studentSyncStatus.textContent=t().sync;try{const {error}=await scoreASupabase.from("scorea_free_diagnostics").insert(payload);if(error)throw error;studentSyncStatus.textContent=t().syncOK}catch(e){console.error(e);studentSyncStatus.textContent=t().syncFail}}

/* STARTER */
const STARTER_SCHEMA="adaptive5-v2";
function currentStarterType(){
  const p=String(getDiagnostic()?.primary_type||"B").toUpperCase();
  return ["A","B","C","D","E"].includes(p)?p:"B";
}
function currentStarterPack(){
  const langPack=STARTER_BY_TYPE[LANG]||STARTER_BY_TYPE.zh;
  return langPack[currentStarterType()]||langPack.B;
}
function loadStarter(){
  const primary=currentStarterType();
  try{
    const x=JSON.parse(localStorage.getItem(STARTER_KEY)||"{}");
    if(x.schema!==STARTER_SCHEMA||x.primary_type!==primary){
      return {schema:STARTER_SCHEMA,primary_type:primary,completed:[],currentDay:1,data:{}};
    }
    return {schema:STARTER_SCHEMA,primary_type:primary,completed:x.completed||[],currentDay:x.currentDay||1,data:x.data||{}};
  }catch(e){
    return {schema:STARTER_SCHEMA,primary_type:primary,completed:[],currentDay:1,data:{}};
  }
}
let starterState=loadStarter(),starterDay=Math.min(starterState.currentDay||1,5),starterTemp={};
function saveStarter(){localStorage.setItem(STARTER_KEY,JSON.stringify(starterState))}
function openStarter(){starterState=loadStarter();starterTemp={};starterDay=Math.min(Math.max(starterState.currentDay||1,1),5);showScreen("starter");renderStarterBanner();refreshStarter();renderStarterDay(starterDay)}
function renderStarterBanner(){
  const d=getDiagnostic(),i=getIdentity();
  if(d&&i){
    const ty=STUDENT_TYPES[LANG]||STUDENT_TYPES.zh;
    const main=ty[d.primary_type]?.[1]||d.primary_type,secondary=ty[d.secondary_type]?.[1]||d.secondary_type;
    const note=LANG==="ms"?`5 soalan di bawah akan memberi keutamaan kepada latihan <b>${esc(main)}</b> berdasarkan diagnosis anda.`:LANG==="en"?`The 5 questions below will prioritise <b>${esc(main)}</b> training based on your diagnostic.`:`下面5题会根据你的诊断，优先训练 <b>${esc(main)}</b>。`;
    starterDiagnosticBanner.innerHTML=t().starterBanner(esc(i.student_name),main,secondary)+`<br><span class="small">${note}</span>`;
  }else starterDiagnosticBanner.innerHTML=t().starterNoDiag;
}
function refreshStarter(){const n=starterState.completed.length;starterProgressText.textContent=t().progress(n);starterProgress.style.width=`${n/5*100}%`;starterTabs.innerHTML="";for(let i=1;i<=5;i++){const b=document.createElement("button");b.className="dayTab";b.textContent=t().questionTab(i);if(i===starterDay)b.classList.add("active");if(starterState.completed.includes(i))b.classList.add("done");const unlocked=i===1||starterState.completed.includes(i)||starterState.completed.includes(i-1);if(!unlocked)b.classList.add("locked");b.onclick=()=>{if(unlocked){starterDay=i;renderStarterDay(i)}};starterTabs.appendChild(b)}}
function openCurrentStarter(){starterDay=Math.min(Math.max(starterState.currentDay||1,1),5);renderStarterDay(starterDay);starterPanel.scrollIntoView({behavior:"smooth",block:"start"})}

    return `<div class="field"><label>${cfg.choiceLabel}</label><div class="choices" id="d1choices">${cfg.choices.map(x=>`<div class="choice" onclick="selectStarterChoice(this,'d1Reason')">${esc(x)}</div>`).join("")}</div></div><div class="field"><label>${cfg.textLabel}</label><textarea id="d1Example"></textarea></div><button class="btn btn-primary btn-wide" onclick="completeStarter1()">${t().complete} 1</button><div class="warn" id="d1warn">${t().fillAll}</div><div class="dayResult" id="d1result"></div>`;

  }
  if(day===4){
    return `<div class="field"><label>${cfg.qLabel}</label><input id="d4Question"></div><div class="field"><label>${cfg.reasonLabel}</label><select id="d4Reason"><option value="">${t().choose}</option>${cfg.reasons.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>${cfg.fixLabel}</label><textarea id="d4Fix"></textarea></div><button class="btn btn-primary btn-wide" onclick="completeStarter4()">${t().complete} 4</button><div class="warn" id="d4warn">${t().fillAll}</div><div class="dayResult" id="d4result"></div>`;
  }
  return `<div class="field"><label>${cfg.subjectLabel}</label><input id="d5Subject"></div><div class="field"><label>${cfg.goalLabel}</label><select id="d5Goal"><option value="">${t().choose}</option>${cfg.goals.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div class="field"><label>${cfg.minutesLabel}</label><select id="d5Minutes"><option value="">${t().choose}</option>${["20","30","45","60","90"].map(x=>`<option value="${x}">${x} ${L==="ms"?"minit":L==="en"?"minutes":"分钟"}</option>`).join("")}</select></div><div class="field"><label>${cfg.measureLabel}</label><textarea id="d5Measure"></textarea></div><button class="btn btn-primary btn-wide" onclick="completeStarter5()">${t().complete} 5</button><div class="warn" id="d5warn">${t().fillAll}</div><div class="dayResult" id="d5result"></div><div id="starterFinish"></div>`;
}
function renderStarterDay(day){starterDay=day;const d=currentStarterPack()[day-1];starterPanel.innerHTML=`<div class="dayHead"><div class="dayNo">${day}</div><div><h2>${esc(d.title)}</h2><p class="muted">${esc(d.intro)}</p></div></div><div class="lesson"><b>${t().core}</b>${esc(d.lesson)}</div>${starterHTML(day)}`;refreshStarter();restoreStarter(day);if(starterState.completed.includes(day))showStarterSaved(day)}
function selectStarterChoice(el,key){el.parentElement.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");starterTemp[key]=el.dataset.value!==undefined?el.dataset.value:el.textContent.trim()}
async function saveChallengeDay(day,data){const i=getIdentity();if(!i)return;const payload={diagnostic_id:i.diagnostic_id,client_session_id:i.client_session_id,email:i.email.toLowerCase(),student_name:i.student_name,grade:i.grade,day_number:day,payload:{...data,adaptive_type:currentStarterType(),schema:STARTER_SCHEMA}};try{const {error}=await scoreASupabase.from("scorea_free_challenge_days").insert(payload);if(error&&error.code!=="23505")throw error}catch(e){console.error(e)}}
async function saveLearningProfile(data){const i=getIdentity(),d=getDiagnostic();if(!i||!data)return;const payload={diagnostic_id:i.diagnostic_id,client_session_id:i.client_session_id,email:i.email.toLowerCase(),student_name:i.student_name,grade:i.grade,primary_type:d?.primary_type||null,secondary_type:d?.secondary_type||null,main_subject:data.subject,improvement_goal:data.goal,daily_study_time:data.minutes,progress_measure:data.measure};try{const {error}=await scoreASupabase.from("scorea_free_learning_profiles").insert(payload);if(error&&error.code!=="23505")throw error}catch(e){console.error(e)}}
function markStarter(day,data){const already=starterState.completed.includes(day);starterState.schema=STARTER_SCHEMA;starterState.primary_type=currentStarterType();starterState.data["day"+day]=data;if(!already)starterState.completed.push(day);starterState.completed.sort((a,b)=>a-b);starterState.currentDay=day<5?Math.max(starterState.currentDay,day+1):5;saveStarter();refreshStarter();if(!already)saveChallengeDay(day,data)}
function swarn(id,on=true){document.getElementById(id)?.classList.toggle("show",on)}function sresult(id,html){const e=document.getElementById(id);if(e){e.innerHTML=html;e.classList.add("show")}}
function completeStarter1(){const cfg=currentStarterPack()[0],reason=starterTemp.d1Reason||starterState.data.day1?.reason||"",example=d1Example.value.trim();if(!reason||!example){swarn("d1warn");return}swarn("d1warn",false);markStarter(1,{reason,example});sresult("d1result",`✅ <b>${esc(cfg.resultLabel)}</b><br>${esc(reason)}<br>${esc(example)}`)}
function completeStarter2(){const cfg=currentStarterPack()[1],method=starterTemp.d2Method!==undefined?Number(starterTemp.d2Method):starterState.data.day2?.method,q=d2Question.value.trim();if(method===undefined||!q){swarn("d2warn");return}swarn("d2warn",false);markStarter(2,{method,q});const ok=method===Number(cfg.correct);sresult("d2result",`${ok?cfg.good:cfg.retry}<br>${LANG==="ms"?"Catatan anda":LANG==="en"?"Your note":"你的记录"}：<b>${esc(q)}</b>`)}
function completeStarter3(){const time=d3Time.value,subject=d3Subject.value.trim(),task=d3Task.value.trim(),distraction=d3Distraction.value;if(!time||!subject||!task||!distraction){swarn("d3warn");return}swarn("d3warn",false);markStarter(3,{time,subject,task,distraction});sresult("d3result",`✅ ${time}｜${esc(subject)}｜25 min<br>${LANG==="ms"?"Tugas":LANG==="en"?"Task":"任务"}：${esc(task)}<br>${LANG==="ms"?"Alih keluar":LANG==="en"?"Remove":"开始前处理"}：${esc(distraction)}`)}
function completeStarter4(){const q=d4Question.value.trim(),reason=d4Reason.value,fix=d4Fix.value.trim();if(!q||!reason||!fix){swarn("d4warn");return}swarn("d4warn",false);markStarter(4,{q,reason,fix});sresult("d4result",LANG==="ms"?`✅ Situasi: ${esc(q)}<br>Punca: ${esc(reason)}<br>Tindakan baharu: ${esc(fix)}`:LANG==="en"?`✅ Situation: ${esc(q)}<br>Cause: ${esc(reason)}<br>New action: ${esc(fix)}`:`✅ 情况：${esc(q)}<br>原因：${esc(reason)}<br>新的做法：${esc(fix)}`)}
function completeStarter5(){const subject=d5Subject.value.trim(),goal=d5Goal.value,minutes=d5Minutes.value,measure=d5Measure.value.trim();if(!subject||!goal||!minutes||!measure){swarn("d5warn");return}swarn("d5warn",false);const data={subject,goal,minutes,measure};markStarter(5,data);saveLearningProfile(data);sresult("d5result",LANG==="ms"?"✅ Pelan pembelajaran 30 hari anda telah siap dan sedang diselaraskan.":LANG==="en"?"✅ Your 30-day learning plan is complete and is being synced.":"✅ 你的30天学习计划已经完成，并正在同步学习档案。");showStarterFinish()}
function restoreStarter(day){const d=starterState.data["day"+day];if(!d)return;setTimeout(()=>{if(day===1){d1Example.value=d.example||"";starterTemp.d1Reason=d.reason||"";[...document.querySelectorAll("#d1choices .choice")].forEach(x=>{if(x.textContent.trim()===d.reason)x.classList.add("selected")})}if(day===2){d2Question.value=d.q||"";starterTemp.d2Method=d.method;[...document.querySelectorAll("#d2choices .choice")].forEach((x,i)=>{if(i===Number(d.method))x.classList.add("selected")})}if(day===3){d3Time.value=d.time||"";d3Subject.value=d.subject||"";d3Task.value=d.task||"";d3Distraction.value=d.distraction||""}if(day===4){d4Question.value=d.q||"";d4Reason.value=d.reason||"";d4Fix.value=d.fix||""}if(day===5){d5Subject.value=d.subject||"";d5Goal.value=d.goal||"";d5Minutes.value=d.minutes||"";d5Measure.value=d.measure||"";if(starterState.completed.includes(5))showStarterFinish()}},0)}
